# Minimal CI for Milestone 1. Extended (security scan, image build, deploy) in Milestone 7.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: finsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finsight" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finsight:ci_only_password@localhost:5432/finsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
